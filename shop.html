<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf6ef">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <title>Shop · Little Oat</title>
  <meta name="description" content="Shop soft baby rompers, sets, dungarees, winter suits and nightwear.">
</head>
<body data-page="shop">
  <main class="wrap">
    <div class="page-hero">
      <span class="eyebrow">The collection</span>
      <h1 id="shop-title">Shop all</h1>
      <p class="muted" id="shop-sub"></p>
    </div>
    <div class="toolbar">
      <div class="chips" id="chips"></div>
      <div style="display:flex;gap:14px;align-items:center;justify-content:space-between">
        <span class="count-note" id="count"></span>
        <select class="select" id="sort" aria-label="Sort products">
          <option value="featured">Featured</option>
          <option value="low">Price: low to high</option>
          <option value="high">Price: high to low</option>
          <option value="sale">Biggest savings</option>
        </select>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
  <script src="config.js"></script>
  <script src="data/images.js"></script>
  <script src="data/products.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
